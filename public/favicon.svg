<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041e3a" />
      <stop offset="100%" stop-color="#082b52" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Comfort Foam Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Core Drop Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#1e40af" stroke-width="1.5" />
  <rect x="4" y="4" width="56" height="56" rx="14" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" stroke-opacity="0.6" />

  <!-- Headboard / Backrest Arch -->
  <path d="M12 28 C12 22, 52 22, 52 28 L52 38 L12 38 Z" fill="#0f3460" stroke="#1d4ed8" stroke-width="1.2" />

  <!-- Mattress Pillow-Top Quilted Comfort Layer (Gold) -->
  <path d="M10 32 C14 30, 22 30, 32 30 C42 30, 50 30, 54 32 C55.5 32.8, 55.5 35.2, 54 36 C50 38, 42 38, 32 38 C22 38, 14 38, 10 36 C8.5 35.2, 8.5 32.8, 10 32 Z" 
        fill="url(#goldGrad)" 
        stroke="#ffffff" 
        stroke-width="0.8" 
        filter="url(#glow)" />

  <!-- Quilted Tufting Diamonds -->
  <circle cx="20" cy="34" r="1" fill="#78350f" />
  <circle cx="28" cy="34" r="1" fill="#78350f" />
  <circle cx="36" cy="34" r="1" fill="#78350f" />
  <circle cx="44" cy="34" r="1" fill="#78350f" />

  <!-- Mattress Core Resilience Layer (Cyan / Natural Latex) -->
  <path d="M10 36.5 C14 38.2, 22 38.5, 32 38.5 C42 38.5, 50 38.2, 54 36.5 L54 44 C50 46, 42 46.5, 32 46.5 C22 46.5, 14 46, 10 44 Z" 
        fill="url(#cyanGrad)" 
        stroke="#0369a1" 
        stroke-width="0.75" />

  <!-- Mattress Spring / Coir Foundation Layer -->
  <path d="M10 44 C14 46, 22 46.5, 32 46.5 C42 46.5, 50 46, 54 44 L54 49 C50 51, 42 51.5, 32 51.5 C22 51.5, 14 51, 10 49 Z" 
        fill="#08203e" 
        stroke="url(#goldGrad)" 
        stroke-width="1" />

  <!-- Bed Foundation Solid Legs -->
  <rect x="13" y="49" width="3" height="5" rx="1.5" fill="#fbbf24" />
  <rect x="48" y="49" width="3" height="5" rx="1.5" fill="#fbbf24" />

  <!-- Biometric Sleep Sparkle Star -->
  <path d="M47 14 Q47 18 51 18 Q47 18 47 22 Q47 18 43 18 Q47 18 47 14 Z" fill="url(#goldGrad)" />
  <circle cx="21" cy="18" r="1.2" fill="#38bdf8" />
  <circle cx="27" cy="15" r="0.8" fill="#fbbf24" />
</svg>